services:
  postgres:
    image: postgres:16-alpine
    container_name: waypoint_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incident}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-incident_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incident} -d ${POSTGRES_DB:-incident_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5.25-community
    container_name: prism_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.35.1
    container_name: prism_ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  migrate:
    build: .
    container_name: prism_migrate
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-incident}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-incident_db}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-incident}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-incident_db}
      APP_ENV: production
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: .
    container_name: prism_api
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_started
      ollama:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-incident}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-incident_db}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-incident}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-incident_db}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_HOST: http://ollama:11434
      APP_ENV: ${APP_ENV:-production}
      API_KEY: ${API_KEY:-}
      PRISM_JWT_SECRET: ${PRISM_JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "8000:8000"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  ollama_data:

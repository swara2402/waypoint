services:
  - type: web
    name: waypoint
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    dockerContext: .
    healthCheckPath: /ready
    dockerCommand: python -c "import os,uvicorn; uvicorn.run('main:app',host='0.0.0.0',port=int(os.getenv('PORT','8000')))"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_LOG_LEVEL
        value: INFO
      - key: API_KEY
        generateValue: true
      - key: WAYPOINT_JWT_SECRET
        generateValue: true
      - key: WAYPOINT_SESSION_HOURS
        value: "8"
      - key: WAYPOINT_BOOTSTRAP_EMAIL
        sync: false
      - key: WAYPOINT_BOOTSTRAP_PASSWORD
        sync: false
      - key: WAYPOINT_BOOTSTRAP_TENANT_NAME
        value: WayPoint Workspace
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: waypoint-db
          property: connectionString
      - key: DATABASE_SYNC_URL
        fromDatabase:
          name: waypoint-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: waypoint-redis
          property: connectionString
      - key: ENABLE_NEO4J
        value: "false"
      - key: ENABLE_OLLAMA
        value: "false"
      - key: ENABLE_FAISS
        value: "false"
      - key: LEARNING_MODE
        value: online
      - key: LEARNING_REQUIRE_CONFIRMATION
        value: "true"
      - key: REQUIRE_TENANT_HEADER
        value: "true"
      - key: MAX_CONCURRENT_INVESTIGATIONS
        value: "2"
      - key: JOB_WORKER_ENABLED
        value: "true"
      # Render pre-deploy is the single production migration authority.
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "false"

  - type: keyvalue
    name: waypoint-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: waypoint-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    databaseName: waypoint
    user: waypoint
    diskSizeGB: 1

previews:
  generation: off

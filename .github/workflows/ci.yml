name: WayPoint CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: waypoint-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  DATABASE_URL: sqlite+aiosqlite:///./waypoint-ci.db
  DATABASE_SYNC_URL: sqlite:///./waypoint-ci.db
  WAYPOINT_JWT_SECRET: test-only-jwt-secret-012345678901234567890123
  API_KEY: test-only-api-key
  ENABLE_NEO4J: "false"
  ENABLE_OLLAMA: "false"
  ENABLE_FAISS: "false"
  LEARNING_MODE: online
  PYTHONUNBUFFERED: "1"

jobs:
  smoke:
    name: Application smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q .
      - name: Import application
        run: python -c "import main; print('WayPoint import OK')"

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  migration-check:
    name: Migration lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: smoke
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./waypoint-migration.db
      DATABASE_SYNC_URL: sqlite:///./waypoint-migration.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Upgrade empty database to head
        run: alembic upgrade head
      - name: Verify migration head
        run: alembic current
      - name: Downgrade to base
        run: alembic downgrade base
      - name: Re-apply migrations
        run: alembic upgrade head
      - name: Verify final migration head
        run: alembic current

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  static-cleanliness:
    name: Static cleanliness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install vulture
        run: python -m pip install --upgrade pip vulture
      - name: Detect high-confidence dead code
        run: vulture . --min-confidence 100 --exclude .git,.venv,venv,node_modules,dist,build

  evaluation-benchmark:
    name: RCA benchmark and evaluation metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate benchmark coverage
        run: python evals/validate_benchmark.py
      - name: Evaluate committed fixture
        run: python evals/evaluate.py evals/sample-results.json

  production-image:
    name: Production container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build --pull -t waypoint-ci:latest .
      - name: Inspect image user
        run: test "$(docker inspect --format='{{.Config.User}}' waypoint-ci:latest)" = "appuser"
      - name: Verify image metadata
        run: docker inspect waypoint-ci:latest >/dev/null

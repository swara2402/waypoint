name: WayPoint External Integration Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Postgres, Neo4j and Ollama
        env:
          POSTGRES_PASSWORD: integration-postgres-password
          NEO4J_PASSWORD: integration-neo4j-password
        run: docker compose up -d postgres neo4j ollama

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install integration clients
        run: |
          python -m pip install --upgrade pip
          pip install neo4j==6.2.0 ollama==0.6.2

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 &&                curl -fsS http://127.0.0.1:7474 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: Verify external integrations
        env:
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: integration-neo4j-password
          OLLAMA_HOST: http://127.0.0.1:11434
        run: python evals/check_integrations.py
